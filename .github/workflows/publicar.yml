name: Actualizar datos y publicar

on:
  schedule:
    - cron: "17 2 * * *"   # cada noche a las 02:17 UTC (03:17 en Madrid en invierno, 04:17 en verano)
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  actualizar-y-publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publicar.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Actualizar datos desde Navision (Metabase)
        if: github.event_name != 'push'
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          METABASE_URL: ${{ vars.METABASE_URL }}
        run: python3 actualizar-datos.py

      - name: Guardar los datos nuevos en el repositorio
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proveedores.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos de Navision $(date -u +%F)"
            git push
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: publicar
        uses: actions/deploy-pages@v4
