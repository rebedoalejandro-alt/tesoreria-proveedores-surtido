name: Actualizar datos

on:
  schedule:
    - cron: "17 2 * * *"   # cada noche a las 02:17 UTC (03:17 en Madrid en invierno, 04:17 en verano)
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  actualizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Actualizar datos desde Navision (Metabase)
        env:
          METABASE_API_KEY: ${{ secrets.METABASE_API_KEY }}
          METABASE_URL: ${{ vars.METABASE_URL }}
        run: python3 actualizar-datos.py

      - name: Guardar los datos nuevos y volver a publicar la web
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proveedores.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los datos."
          else
            git commit -m "Datos de Navision $(date -u +%F)"
            git push
            gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "La web se publicara con el siguiente cambio."
          fi
